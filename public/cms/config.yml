backend:
  name: git-gateway
  branch: main

# Tell Decap CMS the canonical domain so invitation/reset emails link to guiderr.in
# not the old legendary-guiderr-662402.netlify.app subdomain.
site_url: https://www.guiderr.in
logo_url: https://www.guiderr.in/images/guiderr-logo.webp

# Cloudinary popup widget removed. Blog images are referenced by bare Public ID.
# optimizeCloudinaryUrl() in src/utils/cloudinary.ts builds the full CDN URL
# with q_auto:eco,f_auto at render time — zero widget dependency.
# media_folder is required by the Decap CMS schema even when no widget uses it.
media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Business"
          - "Automotive"
          - "Motorcycles"
          - { label: "Personal Finance", value: "Finance" }
          - "Investing"
          - "Travel"
          - "Tech"
          - "Lifestyle"
          - "AI Lab"
      - { label: "Author Name", name: "author", widget: "string", required: false }
      - label: "Featured Image"
        name: "featured_image"
        widget: "string"
        required: false
        hint: >-
          Enter the Cloudinary Public ID only (e.g. blog/bike-hero).
          In Cloudinary Dashboard -> Media Library -> click image -> copy the
          Public ID from the right panel. Do NOT paste the full URL.
      - label: "Amazon Affiliate Link"
        name: "amazon_affiliate_link"
        widget: "string"
        required: false
        hint: "Paste your Amazon amzn.to affiliate link here. Leave blank to hide the CTA button on this article."
      - { label: "Body", name: "body", widget: "markdown" }
    view_filters:
      - label: "Motorcycles"
        field: category
        pattern: "Motorcycles"
      - label: "Automotive"
        field: category
        pattern: "Automotive"
      - label: "Personal Finance"
        field: category
        pattern: "Finance"
      - label: "Investing"
        field: category
        pattern: "Investing"
      - label: "Travel"
        field: category
        pattern: "Travel"
      - label: "Tech"
        field: category
        pattern: "Tech|Gadget & Tech"
      - label: "Lifestyle"
        field: category
        pattern: "Lifestyle|Beauty & Wellness|Home & Living|Art|Pets"
      - label: "Business"
        field: category
        pattern: "Business"
      - label: "AI Lab"
        field: category
        pattern: "AI Lab"

  - name: "featured"
    label: "Featured Stories"
    folder: "src/content/featured"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - "Automotive"
          - { label: "Personal Finance", value: "Finance" }
          - "Investing"
          - "Travel"
          - "Tech"
          - "Business"
          - "Lifestyle"
          - "AI Lab"
      - { label: "Author Name", name: "author", widget: "string", required: false }
      - label: "Featured Image"
        name: "featured_image"
        widget: "string"
        required: false
        hint: >-
          Enter the Cloudinary Public ID only (e.g. featured/story-cover).
          In Cloudinary Dashboard -> Media Library -> click image -> copy the
          Public ID from the right panel. Do NOT paste the full URL.
      - label: "Founder / Subject Portrait"
        name: "founder_image"
        widget: "string"
        required: false
        hint: >-
          Optional. Cloudinary Public ID of the founder or subject's portrait photo.
          This appears as a circular floated image at the start of the article,
          with text wrapping around it. Same format as Featured Image — Public ID only.
      - { label: "Body", name: "body", widget: "markdown" }
