backend:
  name: git-gateway
  branch: main

# Tell Decap CMS the canonical domain so invitation/reset emails link to guiderr.in
# not the old legendary-guiderr-662402.netlify.app subdomain.
site_url: https://www.guiderr.in
logo_url: https://www.guiderr.in/images/guiderr-logo.png

# Cloudinary popup widget removed. Blog images are referenced by bare Public ID.
# optimizeCloudinaryUrl() in src/utils/cloudinary.ts builds the full CDN URL
# with q_auto:eco,f_auto at render time — zero widget dependency.
# media_folder is required by the Decap CMS schema even when no widget uses it.
media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Automotive"
          - "Finance"
          - "Travel"
          - "Tech"
          - "Lifestyle"
      - { label: "Author Name", name: "author", widget: "string", required: false }
      - label: "Featured Image"
        name: "featured_image"
        widget: "string"
        required: false
        hint: >-
          Enter the Cloudinary Public ID only (e.g. blog/bike-hero).
          In Cloudinary Dashboard -> Media Library -> click image -> copy the
          Public ID from the right panel. Do NOT paste the full URL.
      - { label: "Body", name: "body", widget: "markdown" }
    view_filters:
      - label: "Motorcycles"
        field: category
        pattern: "Motorcycles"
      - label: "Automotive"
        field: category
        pattern: "Automotive"
      - label: "Finance"
        field: category
        pattern: "Finance"
      - label: "Travel"
        field: category
        pattern: "Travel"
      - label: "Tech"
        field: category
        pattern: "Tech|Gadget & Tech"
      - label: "Lifestyle"
        field: category
        pattern: "Lifestyle|Beauty & Wellness|Home & Living|Art|Pets|Business"

  - name: "featured"
    label: "Featured Stories"
    folder: "src/content/featured"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - "Automotive"
          - "Finance"
          - "Travel"
          - "Tech"
          - "Lifestyle"
      - { label: "Author Name", name: "author", widget: "string", required: false }
      - label: "Featured Image"
        name: "featured_image"
        widget: "string"
        required: false
        hint: >-
          Enter the Cloudinary Public ID only (e.g. featured/story-cover).
          In Cloudinary Dashboard -> Media Library -> click image -> copy the
          Public ID from the right panel. Do NOT paste the full URL.
      - { label: "Body", name: "body", widget: "markdown" }
