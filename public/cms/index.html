<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Guiderr — Content Manager</title>

    <!-- Only two scripts needed: Netlify Identity for Git Gateway auth, and
         Decap CMS itself. All Cloudinary widget scripts and monkey-patch removed.
         Images are entered as bare Public ID strings in the CMS text field and
         rendered+optimized by src/utils/cloudinary.ts at display time. -->
    <!-- Identity widget must load synchronously BEFORE Decap CMS so that
         window.netlifyIdentity is fully initialized when decap-cms.js runs.
         Using defer on both caused a double-init race: Decap re-called .init()
         mid-render which wiped the login input on every keystroke. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Redirect to home after logout so the Netlify Identity session is fully cleared -->
    <script>
      window.netlifyIdentity && window.netlifyIdentity.on('logout', function () {
        window.location.href = '/';
      });
    </script>
    <script defer src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
  </head>
  <body>
    <!-- Explicit mount point: Decap CMS mounts into this element -->
    <div id="nc-root"></div>
  </body>
</html>
