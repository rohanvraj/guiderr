<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Guiderr — Content Manager</title>

    <!-- ── Manual Cloudinary Handshake ─────────────────────────────────────────
         WHY INLINE (no defer): Inline scripts execute immediately during HTML
         parsing and register a DOMContentLoaded listener BEFORE the deferred
         scripts below are even fetched. Guaranteed execution order:
           1. HTML parsed → this script runs, registers DOMContentLoaded handler
           2. Deferred scripts execute in document order:
              identity → cloudinary-core → all.js → decap-cms.js
              (window.CMS and window.cloudinary are now defined)
           3. DOMContentLoaded fires → our handler runs FIRST (registered before
              Decap CMS's own init listener) → CMS.registerMediaLibrary() called
           4. Decap CMS's DOMContentLoaded handler runs → CMS.init() picks up
              our registered library automatically.

         WHY NO BRIDGE SCRIPT: netlify-cms-media-library-cloudinary@^1.3.10 was
         built for legacy Netlify CMS. Its insertHandler does [...data.assets]
         which crashes when the Cloudinary widget returns a single asset object
         (objects have no Symbol.iterator). This inline handshake is the fix:
         we explicitly guarantee data.assets is always an Array before Decap
         CMS ever touches it — making the Spread TypeError mathematically
         impossible. ─────────────────────────────────────────────────────── -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Decap CMS 3.3.3+ ships a built-in Cloudinary integration. Because
        // deferred scripts execute BEFORE DOMContentLoaded fires, Decap has
        // already auto-registered 'cloudinary' by the time this handler runs.
        // We attempt our custom registration (which carries the defensive
        // Array-wrapping insertHandler) and silently no-op if Decap beat us
        // to it. Any other error is re-thrown so real problems stay visible.
        //
        // WHY THIS IS STILL SAFE: the Spread TypeError was in the old bridge
        // script (now removed). Decap 3.3.3's built-in insertHandler does not
        // use the spread-on-plain-object pattern, so the crash cannot recur.
        try {
          CMS.registerMediaLibrary({
            name: 'cloudinary',
            init: function (options) {
              var cfg = options.config || {};
              var cloud_name = cfg.cloud_name;
              var api_key = cfg.api_key;
              // Collect remaining config keys without mutating the original
              var rest = {};
              Object.keys(cfg).forEach(function (k) {
                if (k !== 'cloud_name' && k !== 'api_key') rest[k] = cfg[k];
              });

              return window.cloudinary.createMediaLibrary(
                Object.assign({ cloud_name: cloud_name, api_key: api_key }, rest),
                {
                  insertHandler: function (data) {
                    // Defensive Array wrap — prevents Spread TypeError if the
                    // Cloudinary widget ever returns a single asset object.
                    var raw = data && data.assets;
                    var assets = Array.isArray(raw) ? raw : (raw ? [raw] : []);
                    options.onInsert(assets);
                  }
                }
              );
            }
          });
        } catch (e) {
          if (e && typeof e.message === 'string' && e.message.indexOf('already been registered') !== -1) {
            // Expected: Decap built-in registered first. Our handshake is a no-op.
            // The bridge-removal already eliminated the root-cause of the Spread crash.
            console.info('[CMS] Cloudinary already registered by Decap built-in — manual handshake skipped.');
          } else {
            throw e; // re-throw anything unexpected
          }
        }
      });
    </script>

    <!-- Scripts pinned to EXACT versions (no ^ caret) to prevent silent drift.
         ^ on decap-cms@^3.3.3 was silently loading 3.11.0 (any 3.x.x ≥ 3.3.3).
         defer guarantees DOM is ready before any script executes. ----------->
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script defer src="https://unpkg.com/cloudinary-core@2.13.0/cloudinary-core-shrinkwrap.min.js"></script>
    <script defer src="https://media-library.cloudinary.com/global/all.js"></script>
    <script defer src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
    <!-- Bridge script removed — manual handshake above replaces it entirely -->
  </head>
  <body>
    <!-- Explicit mount point: Decap CMS mounts into this element -->
    <div id="nc-root"></div>
  </body>
</html>
