<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Guiderr — Content Manager</title>
    <!-- Netlify Identity Widget (required for Git Gateway auth) -->
    <!-- defer: guarantees all scripts execute after full DOM parse, preventing the -->
    <!-- 'Cannot read properties of null (reading appendChild)' crash on /cms      -->
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- 1. Load Cloudinary Core -->
    <script defer src="https://unpkg.com/cloudinary-core@^2.13.0/cloudinary-core-shrinkwrap.min.js"></script>
    <!-- 2. Load the Media Library Widget -->
    <script defer src="https://media-library.cloudinary.com/global/all.js"></script>
    <!-- 3. Load Decap CMS -->
    <script defer src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    <!-- 4. Load the Cloudinary-Decap Bridge (AFTER CMS so CMS.registerMediaLibrary exists) -->
    <script defer src="https://unpkg.com/netlify-cms-media-library-cloudinary@^1.3.10/dist/netlify-cms-media-library-cloudinary.js"></script>
  </head>
  <body>
    <!-- Explicit mount point: Decap CMS mounts its UI here. Declaring it avoids -->
    <!-- any remaining timing ambiguity around dynamic element creation.          -->
    <div id="nc-root"></div>
  </body>
</html>
