    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://legendary-guiderr-662402.netlify.app/og-image.png" />
    <!-- Netlify Identity Widget: must load synchronously so window.netlifyIdentity
         is defined before the redirect handler below runs. Do NOT add 'async' or 'defer'. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Netlify Identity redirect handler: fires after login on the main site,
         sends the user to the CMS dashboard. Safe — never runs on /admin
         because Supabase auth is entirely separate (no window.netlifyIdentity there). -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function(user) {
          if (!user) {
            window.netlifyIdentity.on('login', function() {
              document.location.href = '/cms/';
            });
          }
        });
      }
    </script>
  </body>
</html>
