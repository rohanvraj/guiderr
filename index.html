    <!-- Netlify Identity Widget: must load synchronously so window.netlifyIdentity
         is defined before the redirect handler below runs. Do NOT add 'async' or 'defer'. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Netlify Identity redirect handler: fires after login on the main site,
         sends the user to the CMS dashboard. Safe — never runs on /admin
         because Supabase auth is entirely separate (no window.netlifyIdentity there). -->
    <script>
      // Guard: only register the CMS redirect when the user is on the main site.
      // Skipping on /cms/* prevents this handler from conflicting with Decap CMS's
      // own Netlify Identity initialisation, which was causing the login modal to
      // flicker and close immediately (double-init state reset).
      if (window.netlifyIdentity && !window.location.pathname.startsWith('/cms')) {
        window.netlifyIdentity.on('init', function(user) {
          if (!user) {
            window.netlifyIdentity.on('login', function() {
              document.location.href = '/cms/';
            });
          }
        });
      }
    </script>
  </body>
