    <!-- Netlify Identity Widget: loaded ONLY for admin/CMS sessions.
         Regular readers (100% of traffic) never download this 53KB script.
         Triggers: /cms path, or identity hash tokens in URL (invite/confirm/recovery). -->
    <script>
      (function () {
        var h = window.location.hash;
        var p = window.location.pathname;
        var needsIdentity =
          p.startsWith('/cms') ||
          h.indexOf('confirmation_token') !== -1 ||
          h.indexOf('invite_token') !== -1 ||
          h.indexOf('recovery_token') !== -1 ||
          h.indexOf('access_token') !== -1;

        if (!needsIdentity) return;

        var s = document.createElement('script');
        s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
        s.onload = function () {
          // After login on the main site, redirect to the CMS dashboard.
          // Skip on /cms/* to avoid conflicting with Decap's own Identity init.
          if (window.netlifyIdentity && !window.location.pathname.startsWith('/cms')) {
            window.netlifyIdentity.on('init', function (user) {
              if (!user) {
                window.netlifyIdentity.on('login', function () {
                  document.location.href = '/cms/';
                });
              }
            });
          }
        };
        document.head.appendChild(s);
      })();
    </script>
